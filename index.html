<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Board</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --board-brown: #7a5c3e;
    --board-brown-dark: #5e4630;
    --paper: #faf6ec;
    --paper-edge: #ece4cf;
    --ink: #2c2620;
    --ink-soft: #5c5346;
    --pin-red: #c1452e;
    --pin-blue: #3a5a78;
    --pin-yellow: #d3a021;
    --pin-green: #587a4e;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    background:
      repeating-linear-gradient(45deg, rgba(0,0,0,0.035) 0, rgba(0,0,0,0.035) 2px, transparent 2px, transparent 8px),
      var(--board-brown);
    min-height: 100vh;
  }

  header {
    padding: 32px 20px 20px;
    text-align: center;
  }

  header h1 {
    font-family: 'Kalam', cursive;
    font-size: clamp(2.2rem, 6vw, 3.2rem);
    color: var(--paper);
    margin: 0;
    transform: rotate(-1.5deg);
    text-shadow: 2px 2px 0 rgba(0,0,0,0.25);
  }

  header p {
    color: var(--paper-edge);
    font-size: 0.95rem;
    margin: 6px 0 0;
  }

  .toolbar {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 16px 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }

  .search-wrap {
    flex: 1 1 220px;
  }

  .search-wrap input {
    width: 100%;
    padding: 12px 14px;
    border: none;
    border-radius: 3px;
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    background: var(--paper);
    box-shadow: 0 3px 0 rgba(0,0,0,0.2);
  }

  .cat-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .cat-pill {
    padding: 8px 14px;
    border-radius: 999px;
    border: none;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.82rem;
    cursor: pointer;
    background: rgba(250,246,236,0.85);
    color: var(--ink);
    box-shadow: 0 2px 0 rgba(0,0,0,0.2);
    transition: transform 0.12s ease;
  }

  .cat-pill:active { transform: scale(0.96); }

  .cat-pill.active {
    background: var(--pin-red);
    color: #fff;
  }

  .post-btn {
    padding: 10px 18px;
    border-radius: 3px;
    border: none;
    background: var(--pin-green);
    color: #fff;
    font-weight: 700;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,0.25);
    text-decoration: none;
    display: inline-block;
  }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 10px 16px 60px;
  }

  .board-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 22px 18px;
  }

  .card {
    background: var(--paper);
    padding: 18px 16px 16px;
    border-radius: 2px;
    box-shadow: 0 6px 14px rgba(0,0,0,0.28);
    position: relative;
    transform: rotate(var(--tilt, 0deg));
  }

  .card::before {
    content: '';
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--pin-color, var(--pin-red));
    box-shadow: 0 3px 3px rgba(0,0,0,0.4), inset -2px -2px 3px rgba(0,0,0,0.3), inset 2px 2px 3px rgba(255,255,255,0.4);
  }

  .card-cat {
    display: inline-block;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: #fff;
    background: var(--ink-soft);
    padding: 3px 9px;
    border-radius: 999px;
    margin-bottom: 8px;
  }

  .card h3 {
    font-family: 'Kalam', cursive;
    font-size: 1.25rem;
    margin: 0 0 6px;
    line-height: 1.2;
  }

  .card .price {
    font-weight: 700;
    color: var(--pin-green);
    font-size: 0.95rem;
    margin-bottom: 8px;
  }

  .card .desc {
    font-size: 0.85rem;
    color: var(--ink-soft);
    line-height: 1.4;
    margin-bottom: 10px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card .meta {
    font-size: 0.75rem;
    color: var(--ink-soft);
    border-top: 1px dashed var(--paper-edge);
    padding-top: 8px;
    display: flex;
    justify-content: space-between;
    gap: 6px;
  }

  .card .contact-btn {
    display: block;
    margin-top: 10px;
    text-align: center;
    padding: 8px;
    background: var(--pin-blue);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.82rem;
    border-radius: 3px;
  }

  .state-msg {
    text-align: center;
    color: var(--paper-edge);
    font-family: 'Kalam', cursive;
    font-size: 1.3rem;
    padding: 60px 20px;
  }

  footer {
    text-align: center;
    color: var(--paper-edge);
    font-size: 0.78rem;
    padding: 20px;
    opacity: 0.8;
  }

  footer a { color: var(--paper); }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

// ---- CONFIG ----
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRXSIjbwzFMuunRDaVXphQAW9xkMBXl8jbKmsrTllY93fle1p8liB1uwO8bTnhKcLKM5ssmUhTDQT0q/pub?output=csv";
const FORM_URL = "https://forms.gle/rve5yBqhkeuoJJDJ6";
const CATEGORIES = ["All", "Services", "Electronics", "Furniture", "Freelance", "Other"];

const PIN_COLORS = ["#c1452e", "#3a5a78", "#d3a021", "#587a4e"];
const TILTS = [-2, -1, 0, 1, 2, -1.5, 1.5];

function pick(arr, i) { return arr[i % arr.length]; }

// Find a column's value regardless of exact header spelling/case
function getField(row, candidates) {
  const keys = Object.keys(row);
  for (const c of candidates) {
    const found = keys.find(k => k.trim().toLowerCase() === c.toLowerCase());
    if (found && row[found] && row[found].trim() !== "") return row[found].trim();
  }
  return "";
}

function Card({ listing, index }) {
  const tilt = pick(TILTS, index);
  const pin = pick(PIN_COLORS, index);
  const contactRaw = listing.contact;
  const isEmail = contactRaw.includes("@");
  const isPhone = /^[+0-9()\-\s]{6,}$/.test(contactRaw);
  let contactHref = null;
  let contactLabel = "Contact seller";
  if (isEmail) { contactHref = `mailto:${contactRaw}`; contactLabel = "Email seller"; }
  else if (isPhone) { contactHref = `tel:${contactRaw.replace(/[^+0-9]/g, "")}`; contactLabel = "Call seller"; }

  return (
    <div className="card" style={{ "--tilt": `${tilt}deg`, "--pin-color": pin }}>
      <span className="card-cat">{listing.category || "Listing"}</span>
      <h3>{listing.title || "Untitled listing"}</h3>
      {listing.price && <div className="price">{listing.price}</div>}
      {listing.description && <div className="desc">{listing.description}</div>}
      <div className="meta">
        <span>{listing.location || ""}</span>
        <span>{listing.timestamp ? new Date(listing.timestamp).toLocaleDateString() : ""}</span>
      </div>
      {contactHref ? (
        <a className="contact-btn" href={contactHref}>{contactLabel}</a>
      ) : contactRaw ? (
        <div className="contact-btn" style={{ background: "#8a8175" }}>{contactRaw}</div>
      ) : null}
    </div>
  );
}

function App() {
  const [listings, setListings] = useState([]);
  const [status, setStatus] = useState("loading"); // loading | ready | error
  const [query, setQuery] = useState("");
  const [activeCat, setActiveCat] = useState("All");

  useEffect(() => {
    Papa.parse(CSV_URL, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: (results) => {
        const rows = results.data
          .map((row, i) => ({
            timestamp: getField(row, ["Timestamp"]),
            title: getField(row, ["Listing Title", "Title"]),
            category: getField(row, ["Category"]),
            price: getField(row, ["Price"]),
            description: getField(row, ["Description"]),
            contact: getField(row, ["Contact info", "Contact Info"]),
            location: getField(row, ["Location"]),
          }))
          .filter(r => r.title) // drop blank rows
          .reverse(); // newest first
        setListings(rows);
        setStatus("ready");
      },
      error: () => setStatus("error"),
    });
  }, []);

  const filtered = useMemo(() => {
    return listings.filter(l => {
      const matchesCat = activeCat === "All" || l.category === activeCat;
      const q = query.trim().toLowerCase();
      const matchesQuery = !q || l.title.toLowerCase().includes(q) || l.description.toLowerCase().includes(q);
      return matchesCat && matchesQuery;
    });
  }, [listings, query, activeCat]);

  return (
    <React.Fragment>
      <header>
        <h1>The Board</h1>
        <p>Pin it up. Sell it. Find it.</p>
      </header>

      <div className="toolbar">
        <div className="search-wrap">
          <input
            type="text"
            placeholder="Search listings..."
            value={query}
            onChange={e => setQuery(e.target.value)}
          />
        </div>
        <a className="post-btn" href={FORM_URL} target="_blank" rel="noopener noreferrer">+ Post a listing</a>
      </div>

      <div className="toolbar" style={{ paddingTop: 0 }}>
        <div className="cat-pills">
          {CATEGORIES.map(cat => (
            <button
              key={cat}
              className={"cat-pill" + (activeCat === cat ? " active" : "")}
              onClick={() => setActiveCat(cat)}
            >
              {cat}
            </button>
          ))}
        </div>
      </div>

      <main>
        {status === "loading" && <div className="state-msg">Pinning up listings...</div>}
        {status === "error" && <div className="state-msg">Couldn't load the board right now. Try refreshing.</div>}
        {status === "ready" && filtered.length === 0 && (
          <div className="state-msg">Nothing here yet. Be the first to post!</div>
        )}
        {status === "ready" && filtered.length > 0 && (
          <div className="board-grid">
            {filtered.map((l, i) => <Card key={i} listing={l} index={i} />)}
          </div>
        )}
      </main>

      <footer>
        <p>The Board &middot; <a href={FORM_URL} target="_blank" rel="noopener noreferrer">Post your own listing</a></p>
      </footer>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
